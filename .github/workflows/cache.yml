name: Build Cache [using jupyter-book]
on:
  schedule:
    # Execute cache weekly at 3am on Monday
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Anaconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: true
          miniconda-version: 'latest'
          python-version: "3.13"
          environment-file: environment.yml
          activate-environment: quantecon
      - name: Install JAX (CPU)
        shell: bash -l {0}
        run: |
          # Pinned: jax 0.11.1 (2026-08-17) hangs numpy_vs_numba_vs_jax's
          # lax.fori_loop cells on the CPU path -- context is recorded in
          # QuantEcon/workspace-lectures#49. With jax already present, the
          # lecture's unpinned `!pip install quantecon jax` cell is satisfied
          # and does not upgrade.
          pip install "jax==0.11.0"
      - name: Display Conda Environment Versions
        shell: bash -l {0}
        run: conda list
      - name: Display Pip Versions
        shell: bash -l {0}
        run: pip list
      - name: Build HTML
        shell: bash -l {0}
        run: |
          jb build lectures --path-output ./ -W --keep-going
      - name: Upload Execution Reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: execution-reports
          path: _build/html/reports
      - name: Upload "_build" folder (cache)
        uses: actions/upload-artifact@v4
        with:
          name: build-cache
          path: _build
          include-hidden-files: true
